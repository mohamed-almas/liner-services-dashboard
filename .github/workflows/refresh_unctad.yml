name: Refresh UNCTAD indices

on:
  schedule:
    # Matched to UNCTAD's own release cadence: LSCI_M monthly, PLSCI and LSBCI
    # quarterly. Releases land late in the month (LSCI_M and PLSCI 28 Sep 2026,
    # LSBCI 26 Jun 2026), so each run sits just after a release window.
    #
    # The 15th runs are a safety net, not a second poll: a release that slipped
    # past the 1st would otherwise go unnoticed for a month (LSCI) or a whole
    # quarter (PLSCI/LSBCI). A run with nothing new fetches 0 rows in seconds.
    - cron: "0 5 1 * *"           # LSCI: 1st of each month, 05:00 UTC
    - cron: "0 5 15 * *"          # LSCI: mid-month catch-up
    - cron: "30 5 1 1,4,7,10 *"   # PLSCI + LSBCI: 1st of Jan/Apr/Jul/Oct
    - cron: "30 5 15 1,4,7,10 *"  # PLSCI + LSBCI: mid-month catch-up
  workflow_dispatch:
    inputs:
      dataset:
        description: "Which dataset to refresh."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lsci
          - plsci
          - lsbci
      full:
        description: "Refetch every period from 2006 instead of only new ones. LSBCI is ~690k rows -- expect a long run."
        required: false
        default: false
        type: boolean
      all_codes:
        description: "Drop the economy/port filter so newly added countries or ports come through. May also pull UNCTAD aggregate rows."
        required: false
        default: false
        type: boolean
      discover:
        description: "Dump API measure/dimension metadata instead of loading. Use to find the growth-rate measure codes."
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-unctad
  cancel-in-progress: false

jobs:
  load:
    name: UNCTADstat API → Supabase
    runs-on: ubuntu-latest
    # LSBCI is bilateral (~190 x 190 per quarter); a --full reload is the slow case.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Offline checks
        run: python scripts/test_load_unctad.py

      - name: Load UNCTAD indices
        env:
          UNCTAD_CLIENT_ID: ${{ secrets.UNCTAD_CLIENT_ID }}
          UNCTAD_API_KEY: ${{ secrets.UNCTAD_API_KEY }}
          SUPABASE_URL: https://jeuqpnhajmatekbzlfne.supabase.co/rest/v1
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A scheduled run loads only what that cadence publishes; a manual run
          # uses the chosen input. The loader accepts several dataset names.
          DATASET: >-
            ${{ github.event_name != 'schedule' && (github.event.inputs.dataset || 'all')
             || (startsWith(github.event.schedule, '30 5') && 'plsci lsbci' || 'lsci') }}
          FULL: ${{ github.event.inputs.full }}
          ALL_CODES: ${{ github.event.inputs.all_codes }}
          DISCOVER: ${{ github.event.inputs.discover }}
        run: |
          # Plain `[ test ] && assign` would abort the step under `bash -e`
          # whenever the test is false, so use explicit ifs.
          args="$DATASET"
          if [ "$FULL" = "true" ]; then args="$args --full"; fi
          if [ "$ALL_CODES" = "true" ]; then args="$args --all-codes"; fi
          if [ "$DISCOVER" = "true" ]; then args="$args --discover"; fi
          echo "running: load_unctad.py $args"
          python scripts/load_unctad.py $args
