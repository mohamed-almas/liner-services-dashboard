name: Refresh Market Intelligence

on:
  schedule:
    - cron: "30 3 * * 0"   # every Sunday at 03:30 UTC, after the 02:00 data refresh
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  refresh:
    name: Pre-warm AI insights cache
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh top ports / countries / liners + global
        env:
          # REST endpoint + anon key: same trust level as the deployed dashboard's
          # own client bundle (the anon key is already public there). The Edge
          # Function's service-role key is a separate secret it holds itself.
          SUPABASE_URL: https://jeuqpnhajmatekbzlfne.supabase.co/rest/v1
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpldXFwbmhham1hdGVrYnpsZm5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDQ5NzAsImV4cCI6MjEwMDcyMDk3MH0.hVnlLdqq7NrdLjDok1vBvZ901eFsIbTJ3_VG_kPMsXo
          INSIGHTS_TOP_N: "8"
        run: python scripts/refresh_insights.py
